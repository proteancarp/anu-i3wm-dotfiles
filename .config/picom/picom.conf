# ─────────────────────────────────────────────
# proteancarp — Picom
# ─────────────────────────────────────────────

# Subtle window shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -6;
shadow-offset-y = -6;

# Gentle transparency
inactive-opacity = 0.96;
active-opacity = 1.0;

# Don't fade windows in and out
fading = false;

# Use the XRender backend for broad compatibility
backend = "xrender";
