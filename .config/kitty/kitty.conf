# ─────────────────────────────────────────────
# proteancarp — Kitty
# ─────────────────────────────────────────────

# Font
font_family Noto Sans Mono
font_size 11.5

# Window geometry
window_padding_width 12

# Cursor
cursor_shape block
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# Disable Kitty's tab bar unless multiple tabs exist
tab_bar_edge bottom
tab_bar_style powerline

# ─────────────────────────────────────────────
# Colour palette — mountain mist
# ─────────────────────────────────────────────

foreground #c8d1d5
background #11191c

cursor #c8d1d5

selection_foreground #11191c
selection_background #8aa3a5

color0  #11191c
color1  #9b6b6b
color2  #829b89
color3  #a39a76
color4  #657f91
color5  #82758c
color6  #6f9291
color7  #c8d1d5

color8  #46565b
color9  #b77d7d
color10 #9ab59f
color11 #b9ae85
color12 #7895aa
color13 #9a8cac
color14 #85aaaa
color15 #e0e6e7

background_opacity 0.92

map enter send_text normal \r
